name: Build and publish installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    name: installer (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # base: no NVIDIA (every node without an NVIDIA card). nvidia-open: modern drivers,
        # Turing and newer. nvidia-legacy: NVIDIA 580 for Maxwell/Pascal/Volta. tag_suffix
        # keeps the variants' tags distinct; base keeps the original unsuffixed tags.
        include:
          - variant: base
            tag_suffix: ""
          - variant: nvidia-open
            tag_suffix: "-nvidia-open"
          - variant: nvidia-legacy
            tag_suffix: "-nvidia-legacy"
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build installer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make build VARIANT=${{ matrix.variant }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: talos-installer-amd64-${{ matrix.variant }}
          path: _out/${{ matrix.variant }}/
          retention-days: 7
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish installer
        if: github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ github.repository }}
          VARIANT: ${{ matrix.variant }}
          TAG_SUFFIX: ${{ matrix.tag_suffix }}
        run: |
          set -euo pipefail
          source versions.env
          image="ghcr.io/${REPOSITORY,,}"
          # Load the imager archive; select its image ID independently of its tag.
          loaded=$(docker load --input "_out/${VARIANT}/installer-amd64.tar")
          source_image=$(printf '%s\n' "$loaded" | sed -n -e 's/^Loaded image: //p' -e 's/^Loaded image ID: //p')
          test -n "$source_image"
          # The commit tag identifies this composition, including extension pins.
          # The base variant keeps the original tag form (v1.14.2-<sha>); the NVIDIA variants
          # add a suffix (v1.14.2-nvidia-legacy-<sha>) so no two variants share a tag.
          immutable_tag="${TALOS_VERSION}${TAG_SUFFIX}-${GITHUB_SHA}"
          docker tag "$source_image" "$image:$immutable_tag"
          docker push "$image:$immutable_tag"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            docker tag "$source_image" "$image:${TALOS_VERSION}${TAG_SUFFIX}"
            docker push "$image:${TALOS_VERSION}${TAG_SUFFIX}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            docker tag "$source_image" "$image:${GITHUB_REF_NAME}${TAG_SUFFIX}"
            docker push "$image:${GITHUB_REF_NAME}${TAG_SUFFIX}"
          fi
          echo "Published \`$image:$immutable_tag\` ($VARIANT)" >> "$GITHUB_STEP_SUMMARY"
