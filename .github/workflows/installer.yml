name: Build and publish installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build installer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: talos-installer-amd64
          path: _out/
          retention-days: 7
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish installer
        if: github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          source versions.env
          image="ghcr.io/${REPOSITORY,,}"
          # Load the imager archive; select its image ID independently of its tag.
          loaded=$(docker load --input _out/installer-amd64.tar)
          source_image=$(printf '%s\n' "$loaded" | sed -n -e 's/^Loaded image: //p' -e 's/^Loaded image ID: //p')
          test -n "$source_image"
          # The commit tag identifies this composition, including extension pins.
          immutable_tag="${TALOS_VERSION}-${GITHUB_SHA}"
          docker tag "$source_image" "$image:$immutable_tag"
          docker push "$image:$immutable_tag"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            docker tag "$source_image" "$image:$TALOS_VERSION"
            docker push "$image:$TALOS_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            docker tag "$source_image" "$image:$GITHUB_REF_NAME"
            docker push "$image:$GITHUB_REF_NAME"
          fi
          echo "Published \`$image:$immutable_tag\`" >> "$GITHUB_STEP_SUMMARY"
